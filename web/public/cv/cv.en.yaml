# =====================================================================================================================
#  CV of Vo Anh Duy (English). The Vietnamese CV is cv.vi.yaml in this folder (web/public/cv/).
# =====================================================================================================================
#
#  HOW TO EDIT
#  - Change the text after the "field:" names; keep the field names, the indentation (2 spaces) and the "- " list dashes.
#  - Edit BOTH files the same way: they must have the same structure (same number of skills categories and items,
#    jobs, bullets per job, projects, schools / degrees, certifications, languages, and the same contact fields).
#    If they drift apart the website build fails and lists every difference.
#  - Text in "double quotes" is safest. Quotes are REQUIRED when a text starts with * [ { & ! % @ or `, contains ": "
#    or " #", or is only a number (e.g. a year: "2024"). Inside double quotes write \" for a quote character.
#  - Inside summary, bullets and project descriptions you may use: **bold**, *italic*, [link text](https://...).
#    Everything else (names, titles, skills, periods) is plain text.
#  - Optional fields are marked "optional" below: delete the line to leave it out. Optional sections (projects,
#    certifications, languages) can be removed entirely. Unknown field names (typos) are reported as errors.
#  - The section headings (Summary, Skills, Experience, ...) come from the website template, not from this file.
#
#  HOW TO SEE IT / EXPORT THE PDFs
#  - Preview: run the website (cd web; npm run dev) and open http://localhost:3010/en/cv (and /vi/cv).
#    After saving, just reload the page (no sync needed).
#  - PDFs: in PowerShell run   web\export_cv.ps1
#    It checks both files, builds the site and prints /en/cv and /vi/cv to "CV_Vo Anh Duy_EN.pdf" and
#    "CV_Vo Anh Duy_VN.pdf" in the repo root (the "Download PDF" button and the README link serve those files).
#  - Then commit + push this file, cv.vi.yaml and the two PDFs, and deploy (web\deploy_vercel.ps1).
#  - This file lives in web/public/cv/, so the deployed site also serves it at /cv/cv.en.yaml and /cv/cv.vi.yaml.
# =====================================================================================================================

