# =====================================================================================================================
#  CV của Võ Anh Duy (tiếng Việt). Bản tiếng Anh là cv.en.yaml trong cùng thư mục.
#  Vietnamese CV of Vo Anh Duy. The English CV is cv.en.yaml in this folder (web/public/cv/).
# =====================================================================================================================
#
#  HOW TO EDIT (same rules as cv.en.yaml)
#  - Change the text after the "field:" names; keep the field names, the indentation (2 spaces) and the "- " list dashes.
#  - Edit BOTH files the same way: they must have the same structure (same number of skills categories and items,
#    jobs, bullets per job, projects, schools / degrees, certifications, languages, and the same contact fields).
#    Email, phone, web addresses, project tech lists and certificate links must be identical in both files.
#    If they drift apart the website build fails and lists every difference.
#  - Text in "double quotes" is safest. Quotes are REQUIRED when a text starts with * [ { & ! % @ or `, contains ": "
#    or " #", or is only a number (e.g. a year: "2024"). Inside double quotes write \" for a quote character.
#  - Inside summary, bullets and project descriptions you may use: **bold**, *italic*, [link text](https://...).
#  - Optional fields are marked "optional": delete the line to leave it out. Unknown field names are reported as errors.
#  - The section headings (Tóm tắt, Kỹ năng, Kinh nghiệm, ...) come from the website template, not from this file.
#
#  HOW TO SEE IT / EXPORT THE PDFs
#  - Preview: cd web; npm run dev, then open http://localhost:3010/vi/cv. After saving, reload the page.
#  - PDFs: in PowerShell run   web\export_cv.ps1   -> "CV_Vo Anh Duy_EN.pdf" + "CV_Vo Anh Duy_VN.pdf" in the repo root.
#  - Then commit + push this file, cv.en.yaml and the two PDFs, and deploy (web\deploy_vercel.ps1).
#  - This file lives in web/public/cv/, so the deployed site also serves it at /cv/cv.en.yaml and /cv/cv.vi.yaml.
# =====================================================================================================================

